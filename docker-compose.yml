services:
  firefox-web:
    build: .
    container_name: firefox-web
    ports:
      # Listen on all interfaces so Tailnet IPs can connect directly with
      # end-to-end TLS + WebSocket (no L7 proxy in the middle to break the
      # desktop stream). Re-add the 127.0.0.1 prefix to restrict to localhost
      # and use `ssh -L 6901:localhost:6901` instead.
      - "6901:6901"
    environment:
      BROWSER_USER: browser
      VNC_PASSWORD: change-me
      FIREFOX_START_URL: about:blank
      FREEZE_ON_DISCONNECT: "true"
      # Grace period before Firefox is frozen after the last tab disconnects.
      # Prevents a freeze on every brief mobile app-switch (default 20s).
      DISCONNECT_GRACE_SECONDS: "20"
      # Set to "true" to disable the kasm_user login entirely. Only safe on
      # a trusted network (Tailscale/SSH/VPN, localhost-bound port) — anyone
      # who can reach :6901 gets the browser with no password.
      DISABLE_VNC_AUTH: "false"
      # Software video decode (H.264/AAC via system ffmpeg + OpenH264).
      # Video is silent — KasmVNC open-source cannot forward audio.
      # Set to "false" to restore the previous lowest-CPU, no-video profile.
      ENABLE_VIDEO: "true"
      RESOLUTION: 1280x1024
    shm_size: "2gb"
    mem_limit: "4gb"
    restart: unless-stopped
    # Security: drop all Linux capabilities. Unlike the RDP variant, nothing
    # needs restoring — Xvnc binds an unprivileged port (6901) and runs
    # fully as the unprivileged user (no SETUID helpers, no root sesman).
    cap_drop:
      - ALL
    # Writable rootfs required: entrypoint writes to /home/$user (profile
    # init, .vnc config, TLS cert). /tmp, /var, /run are bounded tmpfs.
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /var:size=128m,mode=0755
      - /run:size=64m,mode=0755
    volumes:
      - firefox-profile:/home/browser

volumes:
  firefox-profile:
