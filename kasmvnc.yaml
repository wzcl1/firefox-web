# KasmVNC per-user config template for firefox-web.
# Rendered by entrypoint.sh into ~/.vnc/kasmvnc.yaml via plain sed substitution
# of the __PLACEHOLDERS__ below (no gettext/envsubst dependency).
network:
  interface: 0.0.0.0
  protocol: http
  websocket_port: __VNC_PORT__
  use_ipv4: true
  use_ipv6: true
  ssl:
    require_ssl: true
    pem_certificate: __CERT_PEM__
    pem_key: __CERT_KEY__
desktop:
  resolution:
    width: __WIDTH__
    height: __HEIGHT__
  allow_resize: true
# Shared session: a reconnect from the same mobile browser tab (e.g. after
# switching apps) joins the existing desktop instead of kicking it or
# prompting for a session takeover, which otherwise looks like a 2nd login.
user_session:
  session_type: shared
  new_session_disconnects_existing_exclusive_session: false
  concurrent_connections_prompt: false
  idle_timeout: never
server:
  advanced:
    kasm_password_file: __PASSWD_FILE__
  auto_shutdown:
    no_user_session_timeout: never
    active_user_session_timeout: never
    inactive_user_session_timeout: never
encoding:
  # React faster to video: default Kasm waits 5s of 45%-screen change before
  # switching to video encoding mode. 2s / 30% makes YouTube etc. smooth
  # sooner without hurting static-page sharpness much.
  max_frame_rate: 60
  video_encoding_mode:
    enter_video_encoding_mode:
      time_threshold: 2
      area_threshold: 30%
# Never prompt to choose a desktop environment: the session is defined by our
# own ~/.vnc/xstartup (see entrypoint.sh), not by select-de.sh.
command_line:
  prompt: false
